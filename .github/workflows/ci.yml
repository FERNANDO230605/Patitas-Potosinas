name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Verificar archivos principales
        run: |
          test -f index.html
          test -f css/styles.css
          test -f js/app.js
          test -f js/data.js
          test -f js/router.js
          test -f js/utils.js
          echo "Archivos principales encontrados correctamente."

      - name: Verificar sintaxis JavaScript
        run: |
          for archivo in $(find js views modals -name "*.js"); do
            node --check "$archivo"
          done
          echo "Sintaxis JavaScript validada correctamente."

      - name: Crear artefacto del proyecto
        run: |
          zip -r patitas-potosinas.zip . \
            -x ".git/*" \
            -x ".github/*"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: patitas-potosinas
          path: patitas-potosinas.zip